  <style>
    body { font-family: 'Nunito', 'Noto Sans JP', 'Noto Sans Arabic', sans-serif; overflow-x: hidden; }
    [dir="rtl"] body, body[dir="rtl"] { font-family: 'Noto Sans Arabic', 'Nunito', sans-serif; }
    .animate-spin-slow { animation: spin 12s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
    .grid-dots { background-image: radial-gradient(#e2e8f0 1.5px, transparent 1.5px); background-size: 16px 12px; }

    .cell-size { width: 29px; height: 29px; display: flex; align-items: center; justify-content: center; transition: all 0.2s cubic-bezier(0.4,0,0.2,1); }
    @media (min-width:360px){ .cell-size{width:32px;height:32px;} }
    @media (min-width:400px){ .cell-size{width:38px;height:38px;} }
    @media (min-width:640px){ .cell-size{width:44px;height:44px;} }
    @media (min-width:768px){ .cell-size{width:48px;height:48px;} }
    @media (min-width:1024px){ .cell-size{width:52px;height:52px;} }

    input[type="range"].custom-slider { -webkit-appearance:none; appearance:none; background:transparent; outline:none; }
    input[type="range"].custom-slider::-webkit-slider-runnable-track { height:14px; background:linear-gradient(90deg,#3b82f6,#818cf8,#ec4899); border-radius:9999px; border:1px solid rgba(255,255,255,.2); }
    input[type="range"].custom-slider::-moz-range-track { height:14px; background:linear-gradient(90deg,#3b82f6,#818cf8,#ec4899); border-radius:9999px; border:1px solid rgba(255,255,255,.2); }
    input[type="range"].custom-slider::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:24px; height:24px; border-radius:9999px; background:#4f46e5; border:3px solid #fff; cursor:pointer; margin-top:-5px; box-shadow:0 4px 10px rgba(79,70,229,.4); transition:transform .15s ease; }
    input[type="range"].custom-slider::-moz-range-thumb { width:24px; height:24px; border-radius:9999px; background:#4f46e5; border:3px solid #fff; cursor:pointer; box-shadow:0 4px 10px rgba(79,70,229,.4); transition:transform .15s ease; box-sizing:border-box; }
    input[type="range"].custom-slider::-webkit-slider-thumb:hover { transform:scale(1.2); }
    input[type="range"].custom-slider::-moz-range-thumb:hover { transform:scale(1.2); }
    .focusable:focus-visible { outline:3px solid #6366f1; outline-offset:2px; }

    .vertical-slider-container { display:flex; align-items:center; justify-content:center; height:100%; width:44px; position:relative; }
    .magic-glow { box-shadow:0 0 20px rgba(129,140,248,.3), inset 0 0 15px rgba(236,72,153,.1); }
    .neon-pulse { animation:neonPulse 2s infinite alternate; }
    @keyframes neonPulse { 0%{box-shadow:0 0 10px rgba(245,158,11,.6), inset 0 0 5px rgba(245,158,11,.2);} 100%{box-shadow:0 0 25px rgba(245,158,11,.9), inset 0 0 10px rgba(245,158,11,.4);} }

    .cell-beam {
      background: rgba(16,185,129,.22) !important;
      border-color: #34d399 !important;
      color: #064e3b !important;
      z-index: 5;
      animation: beamPulse 1.3s ease-in-out infinite alternate;
    }
    @keyframes beamPulse {
      from { box-shadow: 0 0 7px 1px rgba(16,185,129,.45), inset 0 0 5px rgba(16,185,129,.30); }
      to   { box-shadow: 0 0 16px 4px rgba(16,185,129,.90), inset 0 0 10px rgba(16,185,129,.55); }
    }
    .cell-beam-core {
      box-shadow: 0 0 18px 5px rgba(245,158,11,.95), 0 0 30px 9px rgba(16,185,129,.55) !important;
    }
    .cell-dim { filter: blur(1px); opacity: .42; }
    .fill-input { padding:0; box-sizing:border-box; }
    .fill-wrong { animation: fillShake .4s; border-color:#ef4444 !important; background:#fee2e2 !important; }
    @keyframes fillShake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)} }

    .coord-pt { cursor:pointer; }
    .coord-pt:hover { fill: rgba(16,185,129,.18); }
    .coord-target { animation: coordPulse 1.1s ease-in-out infinite alternate; transform-origin:center; }
    @keyframes coordPulse { from { opacity:.55; } to { opacity:1; } }

    @keyframes confettiFall { to { transform: translateY(110vh) rotate(720deg); opacity:.15; } }
    .plane-hit { animation: planeShake .42s ease-in-out; }
    @keyframes planeShake { 0%,100%{transform:translate(0,0)} 15%{transform:translate(-5px,2px)} 30%{transform:translate(5px,-3px)} 45%{transform:translate(-4px,-2px)} 60%{transform:translate(4px,2px)} 80%{transform:translate(-2px,1px)} }
    .plane-miss { animation: planeRipple .5s ease-out; }
    @keyframes planeRipple { 0%{box-shadow: inset 0 0 0 0 rgba(59,130,246,.45)} 100%{box-shadow: inset 0 0 44px 0 rgba(59,130,246,0)} }
    .coord-boom { transform-box: fill-box; transform-origin: center; animation: boomPop .42s ease-out; }
    @keyframes boomPop { 0%{transform:scale(.2); opacity:.3} 60%{transform:scale(1.3)} 100%{transform:scale(1)} }
    @keyframes dotPop { 0%{transform:scale(1);} 45%{transform:scale(1.55);} 100%{transform:scale(1.12);} }
    .dot-counted { animation:dotPop .28s ease; }
    @keyframes floatUp { 0%{opacity:0; transform:translate(-50%,-50%) scale(.5);} 25%{opacity:1;} 100%{opacity:0; transform:translate(-50%,-190%) scale(1.4);} }
    .count-float { position:fixed; z-index:9999; pointer-events:none; font-weight:900; font-size:18px; color:#10b981; text-shadow:0 1px 3px rgba(0,0,0,.3); animation:floatUp .85s ease forwards; }
  </style>

    function getFactorPairs(num) {
      const pairs = [];
      for (let i = 1; i <= Math.sqrt(num); i++) {
        if (num % i === 0) {
          pairs.push([i, num / i]);
          if (i !== num / i && num / i <= 100) pairs.push([num / i, i]);
        }
      }
      return pairs.sort((a, b) => a[0] - b[0]);
    }
    function getPrimeFactors(num) {
      let n = num; const factors = []; let d = 2;
      while (n >= 2) { if (n % d === 0) { factors.push(d); n = n / d; } else d++; }
      return factors;
    }

      if (typeof Tone === "undefined") return; _toneStart();
      try{
        if(!_membrane){ _membrane=new Tone.MembraneSynth({octaves:5,pitchDecay:.08}).toDestination(); _membrane.volume.value=-4; }
        if(!_hitNoise){ _hitNoise=new Tone.NoiseSynth({noise:{type:'white'},envelope:{attack:.001,decay:.32,sustain:0}}).toDestination(); _hitNoise.volume.value=-8; }
        _membrane.triggerAttackRelease('C2','8n'); _hitNoise.triggerAttackRelease('8n');
      }catch(e){}
    }
    function playSplashSound(){
      if (typeof Tone === "undefined") return; _toneStart();
      try{
        if(!_splashNoise){ _splashNoise=new Tone.NoiseSynth({noise:{type:'pink'},envelope:{attack:.002,decay:.18,sustain:0}}).toDestination(); _splashNoise.volume.value=-14; }
        _splashNoise.triggerAttackRelease('16n');
      }catch(e){}
    }
    function playTickSound(urgent){
      if (typeof Tone === "undefined") return; _toneStart();
      try{
        if(!_tickSynth){ _tickSynth=new Tone.Synth({oscillator:{type:'square'},envelope:{attack:.001,decay:.03,sustain:0,release:.01}}).toDestination(); }
        _tickToggle=!_tickToggle; _tickSynth.volume.value = urgent ? -10 : -24;
        _tickSynth.triggerAttackRelease(_tickToggle?'C6':'G5','64n');
      }catch(e){}
    }
    function playVictorySound(){
      if (typeof Tone === "undefined") return; _toneStart();
      [['C5',0],['E5',90],['G5',180],['C6',270],['E6',370],['G6',480]].forEach(([n,d])=>setTimeout(()=>playTone(n,'triangle','16n'),d));
    }
    function launchConfetti(){
      try{
        const colors=['#f43f5e','#f59e0b','#10b981','#3b82f6','#a855f7','#eab308'];
        const cont=document.createElement('div');
        cont.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden';
        for(let i=0;i<100;i++){
          const p=document.createElement('div'); const size=6+Math.random()*9;
          p.style.cssText=`position:absolute;top:-24px;left:${Math.random()*100}%;width:${size}px;height:${size*0.55}px;background:${colors[i%colors.length]};opacity:${0.7+Math.random()*0.3};border-radius:2px;transform:rotate(${Math.random()*360}deg);animation:confettiFall ${1.8+Math.random()*1.8}s linear ${Math.random()*0.5}s forwards`;
          cont.appendChild(p);
        }
        document.body.appendChild(cont); setTimeout(()=>cont.remove(),4200);
      }catch(e){}
    }
    function coordCelebrate(){ launchConfetti(); playVictorySound(); }
    function coordImpactFX(kind){
      const p=document.getElementById('coord-plane'); if(!p) return;
      const cls = kind==='hit' ? 'plane-hit' : 'plane-miss';
      p.classList.remove('plane-hit','plane-miss'); void p.offsetWidth; p.classList.add(cls);
      setTimeout(()=>{ const el=document.getElementById('coord-plane'); if(el) el.classList.remove('plane-hit','plane-miss'); },480);
    }

    /* ===================== SESLİ DİKTE (Web Speech API) ===================== */
    const SPEECH_LANG = { tr:'tr-TR', en:'en-US', es:'es-ES', de:'de-DE', ru:'ru-RU', ja:'ja-JP', ar:'ar-SA' };

    /* Sayıyı seçili dilde kelimeye çevirir (0–100). Ses motorunun rakamı
       yanlış/ekli okumasını engeller: "25" yerine "yirmi beş" söyletilir. */
    const NW = {
      tr: n => { if(n===100) return 'yüz'; const o=['sıfır','bir','iki','üç','dört','beş','altı','yedi','sekiz','dokuz'],t=['','on','yirmi','otuz','kırk','elli','altmış','yetmiş','seksen','doksan']; if(n<10) return o[n]; return (t[Math.floor(n/10)]+(n%10? ' '+o[n%10]:'')).trim(); },
      en: n => { if(n===100) return 'one hundred'; const o=['zero','one','two','three','four','five','six','seven','eight','nine'],te=['ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],t=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety']; if(n<10) return o[n]; if(n<20) return te[n-10]; return t[Math.floor(n/10)]+(n%10? '-'+o[n%10]:''); },
      es: n => { if(n===100) return 'cien'; const sp={0:'cero',1:'uno',2:'dos',3:'tres',4:'cuatro',5:'cinco',6:'seis',7:'siete',8:'ocho',9:'nueve',10:'diez',11:'once',12:'doce',13:'trece',14:'catorce',15:'quince',16:'dieciséis',17:'diecisiete',18:'dieciocho',19:'diecinueve',20:'veinte',21:'veintiuno',22:'veintidós',23:'veintitrés',24:'veinticuatro',25:'veinticinco',26:'veintiséis',27:'veintisiete',28:'veintiocho',29:'veintinueve'}; if(n in sp) return sp[n]; const t={3:'treinta',4:'cuarenta',5:'cincuenta',6:'sesenta',7:'setenta',8:'ochenta',9:'noventa'},o=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve']; return t[Math.floor(n/10)]+(n%10? ' y '+o[n%10]:''); },
      de: n => { if(n===100) return 'hundert'; const o=['null','eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun'],te={10:'zehn',11:'elf',12:'zwölf',13:'dreizehn',14:'vierzehn',15:'fünfzehn',16:'sechzehn',17:'siebzehn',18:'achtzehn',19:'neunzehn'},t=['','','zwanzig','dreißig','vierzig','fünfzig','sechzig','siebzig','achtzig','neunzig'],o1=['','ein','zwei','drei','vier','fünf','sechs','sieben','acht','neun']; if(n<10) return o[n]; if(n<20) return te[n]; const tt=Math.floor(n/10),on=n%10; return on===0? t[tt] : o1[on]+'und'+t[tt]; },
      ru: n => { if(n===100) return 'сто'; const o=['ноль','один','два','три','четыре','пять','шесть','семь','восемь','девять'],te={10:'десять',11:'одиннадцать',12:'двенадцать',13:'тринадцать',14:'четырнадцать',15:'пятнадцать',16:'шестнадцать',17:'семнадцать',18:'восемнадцать',19:'девятнадцать'},t=['','','двадцать','тридцать','сорок','пятьдесят','шестьдесят','семьдесят','восемьдесят','девяносто']; if(n<10) return o[n]; if(n<20) return te[n]; return t[Math.floor(n/10)]+(n%10? ' '+o[n%10]:''); },
      ja: n => { if(n===100) return 'ひゃく'; const o=['ゼロ','いち','に','さん','よん','ご','ろく','なな','はち','きゅう']; if(n<10) return o[n]; const tt=Math.floor(n/10),on=n%10; return (tt===1?'':o[tt])+'じゅう'+(on? o[on]:''); },
      ar: n => { if(n===100) return 'مئة'; const o=['صفر','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة'],te={10:'عشرة',11:'أحد عشر',12:'اثنا عشر',13:'ثلاثة عشر',14:'أربعة عشر',15:'خمسة عشر',16:'ستة عشر',17:'سبعة عشر',18:'ثمانية عشر',19:'تسعة عشر'},t=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون']; if(n<10) return o[n]; if(n<20) return te[n]; const on=n%10; return (on? o[on]+' و':'')+t[Math.floor(n/10)]; }
    };
    function num2words(n, lang){
      n = parseInt(n, 10);
      const f = NW[lang || state.lang] || NW.en;
      try { const w = f(n); return (w == null) ? String(n) : w; } catch(e){ return String(n); }
    }
    let _voices = [];
    function loadVoices(){ try { _voices = (window.speechSynthesis && speechSynthesis.getVoices()) || []; } catch(e){} }
    if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
      loadVoices();
      try { speechSynthesis.onvoiceschanged = loadVoices; } catch(e){}
    }
    function pickVoice(langCode){
      if (!_voices.length) loadVoices();
      const base = langCode.split('-')[0].toLowerCase();
      return _voices.find(v => v.lang && v.lang.toLowerCase() === langCode.toLowerCase())
          || _voices.find(v => v.lang && v.lang.toLowerCase().startsWith(base))
          || null;
    }
    function showSpeechToast(msg){
      let el = document.getElementById('speech-toast');
      if (el) el.remove();
      el = document.createElement('div');
      el.id = 'speech-toast';
      el.textContent = msg;
      el.dir = (state.lang === 'ar') ? 'rtl' : 'ltr';
      el.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:90vw;background:#1e293b;color:#fff;font-weight:700;font-size:13px;padding:10px 16px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:99999;text-align:center;line-height:1.4;';
      document.body.appendChild(el);
      setTimeout(() => { if (el) el.remove(); }, 3200);
    }
    function speakOperation(){
      if (!('speechSynthesis' in window)) { showSpeechToast(t('speechUnavailable')); return; }
      const r = (state.tab === 'detay') ? state.activeGridRows : state.selectedRow;
      const c = (state.tab === 'detay') ? state.activeGridCols : state.selectedCol;
      if (r == null || c == null) return;
      const p = r * c;
      const text = t('speakTmpl', { r:num2words(r), c:num2words(c), p:num2words(p) });
      const langCode = SPEECH_LANG[state.lang] || 'en-US';
      loadVoices();
      const v = pickVoice(langCode);
      // Voices are known but none match this language → don't mis-read with a wrong-language voice
      if (!v && _voices.length > 0) { showSpeechToast(t('speechUnavailable')); return; }
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = langCode; u.rate = state.speechRate; u.pitch = 1.05;
        if (v) u.voice = v;
        const btn = document.getElementById('speak-btn');
        if (btn) {
          btn.classList.add('animate-pulse');
          const stop = () => btn.classList.remove('animate-pulse');
          u.onend = stop; u.onerror = stop;
        }
        speechSynthesis.speak(u);
      } catch(e){}
    }
    window.speakOperation = speakOperation;

    function speakNumber(n){
      if (!('speechSynthesis' in window)) return;
      const langCode = SPEECH_LANG[state.lang] || 'en-US';
      loadVoices();
      const v = pickVoice(langCode);
      if (!v && _voices.length > 0) return; // no proper voice → count silently
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(num2words(n));
        u.lang = langCode; u.rate = Math.max(state.speechRate, 0.95); u.pitch = 1.1;
        if (v) u.voice = v;
        speechSynthesis.speak(u);
      } catch(e){}
    }
    window.speakNumber = speakNumber;

    /* ===================== STATE ===================== */
    const state = {
      lang: 'tr',
      tab: 'kesif',
      selectedRow: 5, selectedCol: 5, selectedNumber: 25,
      activeGridRows: 5, activeGridCols: 5,
      hoveredRow: null, hoveredCol: null,
      showDetails: false,
      workshopMode: 'mult',
      workshopProblem: getProblem('mult'),
      userResult: '', checked: false, isCorrect: false, showMethods: false,
      counted: {}, _celebrated: false, _lastCountDims: '',
      speechRate: 0.6,
      focusMode: true,
      fill: { levelIndex:0, size:5, blanks:{}, values:{}, solved:{}, done:false, _init:false },
      coord: { levelIndex:0, shots:[], ships:[], targets:[], targetIndex:0, message:'', won:false, clue:'', mineEqs:[], mineCoef:[], showHelp:false, showSolve:false, userPts:null, timeLeft:0, timerId:null, _init:false }
    };
  </script>

  <script>
    /* ===================== AKSİYONLAR ===================== */
    function applyDir() {
      const rtl = state.lang === 'ar';
      document.documentElement.lang = state.lang;
      document.documentElement.dir = rtl ? 'rtl' : 'ltr';
      document.body.dir = rtl ? 'rtl' : 'ltr';
    }

    function setLang(l) { state.lang = l; applyDir(); render(); }
    window.setLang = setLang;

    function setTab(tabName) { state.tab = tabName; render(); }
    window.setTab = setTab;

    function setHoveredCell(r, c) { state.hoveredRow = r; state.hoveredCol = c; updateTableHighlights(); }
    window.setHoveredCell = setHoveredCell;
    function clearHoveredCell() { state.hoveredRow = null; state.hoveredCol = null; updateTableHighlights(); }
    window.clearHoveredCell = clearHoveredCell;

    function selectHeader(type, val) {
      playSelectSound();
      if (type === 'row') state.selectedRow = (state.selectedRow === val) ? null : val;
      else state.selectedCol = (state.selectedCol === val) ? null : val;
      if (state.selectedRow !== null && state.selectedCol !== null) {
        state.selectedNumber = state.selectedRow * state.selectedCol;
        state.activeGridRows = state.selectedRow; state.activeGridCols = state.selectedCol;
      }
      state.showDetails = false; window.syncInteractiveTable();
    }
    window.selectHeader = selectHeader;

    function selectCellDirectly(r, c) {
      playSelectSound();
      state.selectedRow = r; state.selectedCol = c; state.selectedNumber = r * c;
      state.activeGridRows = r; state.activeGridCols = c;
      state.showDetails = false; window.syncInteractiveTable();
    }
    window.selectCellDirectly = selectCellDirectly;

    function handleHorizontalSlider(val) {
      playSelectSound(); state.selectedCol = parseInt(val);
      if (state.selectedRow !== null) { state.selectedNumber = state.selectedRow*state.selectedCol; state.activeGridRows=state.selectedRow; state.activeGridCols=state.selectedCol; }
      window.syncInteractiveTable();
    }
    window.handleHorizontalSlider = handleHorizontalSlider;

    function handleVerticalSlider(val) {
      playSelectSound(); state.selectedRow = 11 - parseInt(val);
      if (state.selectedCol !== null) { state.selectedNumber = state.selectedRow*state.selectedCol; state.activeGridRows=state.selectedRow; state.activeGridCols=state.selectedCol; }
      window.syncInteractiveTable();
    }
    window.handleVerticalSlider = handleVerticalSlider;

    function openDetails() {
      if (state.selectedRow == null || state.selectedCol == null) return;
      playSelectSound();
      state.activeGridRows = state.selectedRow; state.activeGridCols = state.selectedCol;
      const dk = state.activeGridRows + 'x' + state.activeGridCols;
      if (state._lastCountDims !== dk) { state.counted = {}; state._celebrated = false; state._lastCountDims = dk; }
      state.tab = 'detay'; render();
      try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch(e){ window.scrollTo(0,0); }
    }
    window.openDetails = openDetails;
    function backToTable() { playSelectSound(); state.tab = 'kesif'; render(); }
    window.backToTable = backToTable;

    function setGridDimensions(r, c) {
      playSelectSound();
      state.activeGridRows = r; state.activeGridCols = c;
      const dk = r + 'x' + c;
      if (state._lastCountDims !== dk) { state.counted = {}; state._celebrated = false; state._lastCountDims = dk; }
      if (state.tab === 'detay') render(); else window.syncInteractiveTable();
    }
    window.setGridDimensions = setGridDimensions;

    function setWorkshopMode(modeKey) {
      state.workshopMode = modeKey; state.workshopProblem = getProblem(modeKey);
      state.userResult=''; state.checked=false; state.isCorrect=false; state.showMethods=false; render();
    }
    window.setWorkshopMode = setWorkshopMode;

    function refreshWorkshopProblem() {
      state.workshopProblem = getProblem(state.workshopMode);
      state.userResult=''; state.checked=false; state.isCorrect=false; state.showMethods=false; render();
    }
    window.refreshWorkshopProblem = refreshWorkshopProblem;

    function handleResultInput(val) {
      state.userResult = val;
      const btn = document.getElementById('check-btn');
      if (btn) btn.disabled = val.trim() === '';
    }
    window.handleResultInput = handleResultInput;
    function handleResultKey(e){ if (e.key === 'Enter') { e.preventDefault(); checkResult(); } }
    window.handleResultKey = handleResultKey;

    function checkResult() {
      const guess = parseInt((state.userResult||'').trim(), 10);
      if (isNaN(guess)) return;
      state.checked = true; state.isCorrect = (guess === state.workshopProblem.answer); state.showMethods = true;
      if (state.isCorrect) playRewardSound(); else playTone("G3","triangle","4n");
      render();
    }
    window.checkResult = checkResult;
    function toggleMethods(){ state.showMethods = !state.showMethods; render(); }
    window.toggleMethods = toggleMethods;

    function resetCount(){ state.counted = {}; state._celebrated = false; if (state.tab === 'detay') render(); else if (window.syncInteractiveTable) window.syncInteractiveTable(); }
    window.resetCount = resetCount;

    function countDot(btn){
      const key = btn.dataset.key;
      if (state.counted[key]) {
        delete state.counted[key];
        btn.classList.remove('bg-emerald-500','dot-counted');
        btn.classList.add('bg-indigo-500');
        playTone('A3','sine','64n');
      } else {
        state.counted[key] = true;
        btn.classList.remove('bg-indigo-500','bg-pink-500');
        btn.classList.add('bg-emerald-500');
        void btn.offsetWidth;
        btn.classList.add('dot-counted');
        playTone('E5','sine','64n');
        floatCount(btn);
        const _n = Object.keys(state.counted).length;
        setTimeout(() => speakNumber(_n), 90);
      }
      updateCountBadge();
    }
    window.countDot = countDot;

    function floatCount(btn){
      const n = Object.keys(state.counted).length;
      const rect = btn.getBoundingClientRect();
      const el = document.createElement('div');
      el.className = 'count-float';
      el.style.left = (rect.left + rect.width/2) + 'px';
      el.style.top = (rect.top + rect.height/2) + 'px';
      el.textContent = n;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 850);
    }

    function updateCountBadge(){
      const total = state.activeGridRows * state.activeGridCols;
      const n = Object.keys(state.counted).length;
      const badge = document.getElementById('dot-count-badge');
      if (!badge) return;
      const done = n === total && total > 0;
      if (done) {
        badge.innerHTML = t('countDone');
        badge.className = 'text-[11px] font-bold px-3 py-1 rounded-full border bg-emerald-500 text-white border-emerald-500';
        if (!state._celebrated) { playRewardSound(); state._celebrated = true; }
      } else {
        badge.innerHTML = `${t('countedLabel')}: <b>${n}</b> / ${total}`;
        badge.className = 'text-[11px] font-bold px-3 py-1 rounded-full border bg-emerald-50 text-emerald-700 border-emerald-200';
        state._celebrated = false;
      }
    }
    window.updateCountBadge = updateCountBadge;

    function adjustVerticalSliderWidth() {
      const vContainer = document.querySelector('.vertical-slider-container');
      const vSlider = document.getElementById('vertical-range-input');
      if (vContainer && vSlider) vSlider.style.width = `${vContainer.clientHeight - 12}px`;
    }
    window.adjustVerticalSliderWidth = adjustVerticalSliderWidth;
  </script>

  <script>
    /* ===================== ALAN MODELİ (sayılabilir) ===================== */
    function renderAreaModel(rows, cols) {
      const total = rows * cols;
      let rowsHtml = '';
      for (let r = 0; r < rows; r++) {
        let cells = '';
        for (let c = 0; c < cols; c++) {
          const key = r + '_' + c;
          const counted = !!state.counted[key];
          const color = counted ? 'bg-emerald-500' : 'bg-indigo-500';
          cells += `<button type="button" data-key="${key}" onclick="countDot(this)" aria-label="${t('countedLabel')}" class="focusable border border-white/80 box-border p-0 inline-block w-6 h-6 cursor-pointer transition-transform hover:scale-110 hover:relative hover:z-10 ${color}"></button>`;
        }
        rowsHtml += `<div class="flex items-center">${cells}</div>`;
      }
      const counted = Object.keys(state.counted).length;
      const done = counted === total && total > 0;
      const badgeInner = done ? t('countDone') : `${t('countedLabel')}: <b>${counted}</b> / ${total}`;
      const badgeCls = done ? 'bg-emerald-500 text-white border-emerald-500' : 'bg-emerald-50 text-emerald-700 border-emerald-200';
      return `
        <div class="inline-flex flex-col items-center">
          <div class="inline-flex flex-col">${rowsHtml}</div>
          <div class="mt-3 flex flex-col items-center gap-1.5">
            <div class="text-xs font-extrabold text-slate-500" dir="ltr">${rows} × ${cols} = ${total}</div>
            <div class="flex items-center gap-2">
              <div id="dot-count-badge" class="text-[11px] font-bold px-3 py-1 rounded-full border ${badgeCls}">${badgeInner}</div>
              <button type="button" onclick="resetCount()" class="focusable text-[11px] font-bold px-2.5 py-1 rounded-full bg-slate-100 text-slate-500 border border-slate-200 hover:bg-slate-200">${t('resetCount')}</button>
            </div>
          </div>
        </div>`;
    }

    function renderCPA(r, c, product){
      const palette = ['bg-sky-500','bg-pink-500','bg-amber-500','bg-emerald-500','bg-violet-500','bg-rose-500','bg-cyan-500','bg-orange-500','bg-lime-500','bg-fuchsia-500'];
      // 1) Somut: r grup, her grupta c nesne
      let groupsHtml = '';
      for (let g = 0; g < r; g++) {
        let dots = '';
        for (let i = 0; i < c; i++) dots += `<span class="inline-block w-2.5 h-2.5 rounded-full ${palette[g % palette.length]}"></span>`;
        groupsHtml += `<div class="inline-flex flex-wrap items-center justify-center gap-1 p-1.5 rounded-lg bg-white border border-slate-200 shadow-sm" style="max-width:110px">${dots}</div>`;
      }
      const repeated = Array.from({length:r}, () => c).join(' + ') + ' = ' + product;
      // 2) Görsel: tek interaktif alan modeli (renderAreaModel) + bar modeli
      const areaHtml = renderAreaModel(r, c);
      let barCells = '';
      for (let g = 0; g < r; g++) barCells += `<div class="flex-1 min-w-[16px] text-center text-[10px] sm:text-xs font-bold text-rose-900 bg-rose-200/90 ${g<r-1?'border-e border-white':''} py-1">${c}</div>`;
      // 3) Soyut: sözel okunuş
      const verbal = t('speakTmpl', { r:num2words(r), c:num2words(c), p:num2words(product) });

      return `
        <div class="mb-6 rounded-2xl border border-indigo-100 bg-gradient-to-br from-indigo-50/60 to-purple-50/60 p-4">
          <h4 class="font-extrabold text-indigo-900 text-sm mb-3">${t('cpaTitle')}</h4>
          <div class="space-y-3">
            <div class="bg-white rounded-xl border border-slate-200 p-3 shadow-sm">
              <span class="inline-block text-[10px] font-extrabold uppercase tracking-wider text-sky-700 bg-sky-100 px-2 py-0.5 rounded-full">${t('cpaConcrete')}</span>
              <div class="flex flex-wrap gap-1.5 mt-2 mb-2">${groupsHtml}</div>
              <div class="text-[11px] font-bold text-slate-700 break-words" dir="ltr">${repeated}</div>
              <div class="text-[10px] text-slate-400 mt-1">${t('cpaConcreteHint',{r:r,c:c})}</div>
            </div>

      primeFactorsHtml += `<span class="text-amber-700 text-sm font-extrabold mx-1">=</span><span class="px-2.5 py-1 bg-amber-500 text-white font-extrabold rounded-lg text-xs shadow-sm">${val}</span>`;

      const divisionHtml = getDivisionExamples(val).map(d => `<div class="bg-white px-2.5 py-1.5 rounded-lg border border-blue-100 text-xs font-medium text-blue-900 flex justify-between shadow-sm" dir="ltr"><span>${d.dividend} ÷ ${d.divisor}</span><span class="text-blue-500 font-bold">= ${val}</span></div>`).join('');

      return `
        <h3 class="font-bold text-slate-800 text-base mb-4 flex items-center gap-2">📊 ${t('detailsTitle',{n:val})}</h3>
        ${renderCPA(state.activeGridRows, state.activeGridCols, val)}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="bg-slate-900 text-white rounded-2xl p-5 shadow-sm relative overflow-hidden">
            <div class="absolute end-0 top-0 translate-x-4 -translate-y-4 text-slate-800 opacity-20 pointer-events-none">${getIcon('gitBranch','w-36 h-36')}</div>
            <div>
              <span class="text-[10px] font-bold tracking-wider text-indigo-300 uppercase">${t('netStructure')}</span>
              <div class="flex items-center gap-3 mt-3">

                <div><h4 class="font-extrabold text-sm">${t('equalProducts')}</h4><p class="text-[11px] text-slate-400">${t('equalProductsSub')}</p></div>
              </div>
              <div class="flex flex-wrap gap-1.5 mt-4">${factorButtonsHtml}</div>
            </div>

          <div class="flex flex-col gap-3">

              <h4 class="font-bold text-amber-900 text-xs uppercase tracking-wider mb-2 flex items-center gap-1">🧩 ${t('buildingBlocks')}</h4>
              <div class="flex flex-wrap gap-1.5 items-center" dir="ltr">${primeFactorsHtml}</div>
            </div>
            <div class="bg-blue-50/50 p-4 rounded-xl border border-blue-200/60">
              <h4 class="font-bold text-blue-900 text-xs uppercase tracking-wider mb-2 flex items-center gap-1">➗ ${t('divisionRelation')}</h4>
              <div class="space-y-1">${divisionHtml}</div>

    }
    window.renderDetailsPanelContent = renderDetailsPanelContent;
  </script>

  <script>
    /* ===================== HEDEFLİ DOM GÜNCELLEME ===================== */
    window.syncInteractiveTable = function() {
      const dimKey = state.activeGridRows + 'x' + state.activeGridCols;
      if (state._lastCountDims !== dimKey) { state.counted = {}; state._celebrated = false; state._lastCountDims = dimKey; }
      const row = state.selectedRow, col = state.selectedCol;
      const product = (row !== null && col !== null) ? (row * col) : '?';

      const rd = document.getElementById('formula-row-display');
      const cd = document.getElementById('formula-col-display');
      const rs = document.getElementById('formula-res-display');
      if (rd) rd.innerText = row ?? '?';
      if (cd) cd.innerText = col ?? '?';
      if (rs) rs.innerText = product;

      const hS = document.getElementById('horizontal-range-input');
      const vS = document.getElementById('vertical-range-input');
      if (hS) hS.value = col ?? 5;
      if (vS) vS.value = 11 - (row ?? 5);

      updateTableHighlights();
    };

    function updateTableHighlights() {
      const rowAct = state.hoveredRow ?? state.selectedRow ?? null;
      const colAct = state.hoveredCol ?? state.selectedCol ?? null;

      document.querySelectorAll('[id^="th-col-"]').forEach(th => {
        const col = parseInt(th.id.replace('th-col-',''));
        const sel = state.selectedCol === col, hov = state.hoveredCol === col;
        th.className = "focusable cell-size rounded-xl cursor-pointer flex items-center justify-center select-none transition-all duration-300 " +
          (sel ? "bg-indigo-600 text-white font-black scale-110 shadow-md ring-2 ring-indigo-300" : hov ? "bg-indigo-100 text-indigo-800 scale-105 font-bold" : "bg-slate-100 text-slate-500 font-bold hover:bg-slate-200");
      });
      document.querySelectorAll('[id^="th-row-"]').forEach(th => {
        const row = parseInt(th.id.replace('th-row-',''));
        const sel = state.selectedRow === row, hov = state.hoveredRow === row;
        th.className = "focusable cell-size rounded-xl cursor-pointer flex items-center justify-center select-none transition-all duration-300 " +
          (sel ? "bg-indigo-600 text-white font-black scale-110 shadow-md ring-2 ring-indigo-300" : hov ? "bg-indigo-100 text-indigo-800 scale-105 font-bold" : "bg-slate-100 text-slate-500 font-bold hover:bg-slate-200");
      });
      document.querySelectorAll('.table-cell').forEach(td => {
        const r = parseInt(td.dataset.row), c = parseInt(td.dataset.col);
        const isRowMatch = r === rowAct, isColMatch = c === colAct;
        const isInt = r === state.selectedRow && c === state.selectedCol;
        const isHovInt = r === state.hoveredRow && c === state.hoveredCol;
        const selR = state.selectedRow, selC = state.selectedCol;
        const beamOn = (selR != null && selC != null);
        const onHBeam = beamOn && r === selR && c <= selC;
        const onVBeam = beamOn && c === selC && r <= selR;
        const onBeam = (onHBeam || onVBeam) && !isInt;
        const isFocus = isInt || isHovInt || onBeam || isRowMatch || isColMatch;
        let cls = "table-cell focusable cell-size text-center align-middle cursor-pointer rounded-lg border text-xs sm:text-sm md:text-base font-bold transition-all duration-200 select-none flex items-center justify-center ";
        if (isInt) cls += "!bg-gradient-to-br !from-amber-400 !to-orange-500 !text-slate-950 font-extrabold ring-4 ring-amber-300 scale-125 z-20 shadow-xl border-amber-500 cell-beam-core ";
        else if (isHovInt) cls += "bg-indigo-500 text-white scale-110 shadow-md z-10 border-indigo-600 ";
        else if (onBeam) cls += "cell-beam ";
        else if (isRowMatch || isColMatch) cls += "bg-indigo-50/90 text-indigo-900 border-indigo-100 ring-1 ring-indigo-100/50 ";
        else if (r === c) cls += "bg-amber-100 text-amber-950 font-semibold border-amber-300 ";
        else if ([1,2,5,10].includes(r) || [1,2,5,10].includes(c)) cls += "bg-blue-50 text-blue-800 border-blue-100/80 ";
        else if ([3,4].includes(r) || [3,4].includes(c)) cls += "bg-green-50 text-green-800 border-green-100/80 ";
        else cls += "bg-rose-50 text-rose-800 border-rose-100/80 ";
        if (!isFocus && state.focusMode) cls += "cell-dim ";
        td.className = cls;
      });
    }
  </script>

  <script>
    /* ===================== KOORDİNAT AVI (oyun) ===================== */
    const COORD_LEVELS = [
      { mode:'enter', range:5, shipCount:3, shipLen:1 },
      { mode:'read',  range:5, targetCount:4 },
      { mode:'enter', range:8, ships:[3,2,2] },
      { mode:'mine',  range:6 }
    ];

    function coordGen(){
      const c = state.coord, lv = COORD_LEVELS[c.levelIndex], R = lv.range;
      const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
      coordClearTimer();
      c.shots=[]; c.ships=[]; c.targets=[]; c.targetIndex=0; c.message=''; c.won=false; c.lost=false; c.clue=''; c.clueLine=null; c.mineEqs=[]; c.mineCoef=[]; c.showHelp=false; c.showSolve=false; c.supply=null; c.userPts=null; c.timeLeft=0;
      if (lv.mode === 'read') {
        const used = new Set();
        while (c.targets.length < lv.targetCount) {
          const x=rnd(-R,R), y=rnd(-R,R), k=x+','+y;
          if (k==='0,0' || used.has(k)) continue;
          used.add(k); c.targets.push({x,y,sunk:false});
        }
      } else if (lv.mode === 'mine') {
        const eqStr = (m,b) => { const ms=m===1?'':(m===-1?'−':String(m).replace('-','−')); const bs=b===0?'':(b>0?' + '+b:' − '+(-b)); return 'y = '+ms+'x'+bs; };
        const sl=[-2,-1,1,2];
        let m1,b1,m2,b2,ix,iy,guard=0,ok=false;
        do {
          m1=sl[rnd(0,3)]; m2=sl[rnd(0,3)]; b1=rnd(-4,4); b2=rnd(-4,4);
          if (m1===m2) { guard++; continue; }
          const dx=b2-b1, dm=m1-m2;
          if (dx % dm !== 0) { guard++; continue; }
          ix = dx/dm; iy = m1*ix+b1;
          ok = (ix>=-R && ix<=R && iy>=-R && iy<=R);
        } while (!ok && guard++ < 400);
        if (!ok) { m1=2;b1=1;m2=-1;b2=4; ix=1; iy=3; }
        c.mineEqs = [eqStr(m1,b1), eqStr(m2,b2)];
        c.mineCoef = [{m:m1,b:b1},{m:m2,b:b2}];
        c.clue = c.mineEqs.join('   ·   ');
        c.ships.push({ cells:[{x:ix,y:iy}], hits:[false], sunk:false });
        c.userPts = { 1:[{x:'',y:''},{x:'',y:''}], 2:[{x:'',y:''},{x:'',y:''}] };
        c.timeLeft = 180;
      } else {
        if (lv.shipLen) {
          const used=new Set();
          for (let s=0; s<lv.shipCount; s++){
            let x,y,k; do { x=rnd(-R,R); y=rnd(-R,R); k=x+','+y; } while (used.has(k) || k==='0,0');
            used.add(k); c.ships.push({ cells:[{x,y}], hits:[false], sunk:false });
          }
        } else {
          const used=new Set();
          for (const len of lv.ships){
            let placed=false, tries=0;
            while (!placed && tries++<300){
              const horiz = Math.random()<0.5;
              const x0 = horiz ? rnd(-R, R-len+1) : rnd(-R, R);
              const y0 = horiz ? rnd(-R, R) : rnd(-R+len-1, R);
              const cells=[]; let ok=true;
              for (let k=0;k<len;k++){
                const x = horiz ? x0+k : x0;
                const y = horiz ? y0 : y0-k;
                const key=x+','+y;
                if (used.has(key)) { ok=false; break; }
                cells.push({x,y});
              }
              if (ok){ cells.forEach(ce=>used.add(ce.x+','+ce.y)); c.ships.push({cells, hits:cells.map(()=>false), sunk:false}); placed=true; }
            }
          }
        }
      }
      // gizli mühimmat gemisi (sadece atış modlarında)
      if (lv.mode !== 'read') {
        const occ = new Set(); c.ships.forEach(s=>s.cells.forEach(ce=>occ.add(ce.x+','+ce.y)));
        let sx,sy,sk,guard=0; do { sx=rnd(-R,R); sy=rnd(-R,R); sk=sx+','+sy; } while ((occ.has(sk)||sk==='0,0') && guard++<150);
        c.supply = { x:sx, y:sy, found:false };
      }
      // cephane
      const totalCells = c.ships.reduce((a,s)=>a+s.cells.length,0);
      c.maxAmmo = lv.mode==='read' ? lv.targetCount*2 : (lv.mode==='mine' ? 6 : Math.min(14, totalCells*2+2));
      c.ammo = c.maxAmmo;
      c._init = true;
      if (lv.mode === 'mine') coordStartTimer();
    }

    function coordSetLevel(i){ state.coord.levelIndex=i; coordGen(); render(); }
    window.coordSetLevel = coordSetLevel;
    function coordReset(){ coordGen(); render(); }
    window.coordReset = coordReset;
    function coordNext(){ const c=state.coord; c.levelIndex=(c.levelIndex+1)%COORD_LEVELS.length; coordGen(); render(); }
    window.coordNext = coordNext;
    function coordToggleHelp(){ state.coord.showHelp = !state.coord.showHelp; render(); }
    window.coordToggleHelp = coordToggleHelp;
    function coordToggleSolve(){ state.coord.showSolve = !state.coord.showSolve; render(); }
    window.coordToggleSolve = coordToggleSolve;
    function coordSolveSteps(){
      const c=state.coord; if(!c.mineCoef || c.mineCoef.length<2 || !c.ships[0]) return '';
      const a=c.mineCoef[0], b=c.mineCoef[1], mine=c.ships[0].cells[0];
      const f = n => String(n).replace('-','−');
      const rhs = (m,k) => { const ms = m===1?'x':(m===-1?'−x':f(m)+'x'); const ks = k===0?'':(k>0?' + '+k:' − '+(-k)); return ms+ks; };
      const sb = k => k===0?'':(k>0?' + '+k:' − '+(-k));
      const dm=a.m-b.m, db=b.b-a.b;
      const dms = dm===1?'x':(dm===-1?'−x':f(dm)+'x');
      const L=[
        `${rhs(a.m,a.b)} = ${rhs(b.m,b.b)}`,
        `${dms} = ${f(db)}`,
        `x = ${f(db)} ÷ ${f(dm)} = ${f(mine.x)}`,
        `y = ${f(a.m)} · (${f(mine.x)})${sb(a.b)} = ${f(mine.y)}`,
        `➜ (${f(mine.x)}, ${f(mine.y)})`
      ];
      return L.map(s=>`<div>${s}</div>`).join('');
    }

    function coordFmt(s){ s=Math.max(0,s|0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
    function coordClearTimer(){ const c=state.coord; if(c.timerId){ clearInterval(c.timerId); c.timerId=null; } }
    function coordStartTimer(){ coordClearTimer(); state.coord.timerId=setInterval(coordTick,1000); }
    function coordTick(){
      const c=state.coord, lv=COORD_LEVELS[c.levelIndex];
      if (state.tab!=='koord' || lv.mode!=='mine' || c.won || c.lost){ coordClearTimer(); return; }
      c.timeLeft--;
      if (c.timeLeft<=0){ c.timeLeft=0; c.lost=true; c.message=t('bombFailMsg'); coordClearTimer(); render(); coordImpactFX('hit'); return; }
      playTickSound(c.timeLeft<=15);
      const el=document.getElementById('coord-timer');
      if (el){ el.textContent='⏱ '+coordFmt(c.timeLeft); if (c.timeLeft<=15){ el.classList.add('text-rose-600'); el.classList.remove('text-slate-700'); } }
    }
    function coordPlotInput(li,ri,axis,val){
      const c=state.coord; if(!c.userPts) return;
      c.userPts[li][ri][axis]=val.replace(/[^0-9-]/g,'');
      const p=document.getElementById('coord-plane'); if(p) p.innerHTML=buildCoordSVG();
    }
    window.coordPlotInput = coordPlotInput;
    function coordPick(x,y){ const X=document.getElementById('coord-x'), Y=document.getElementById('coord-y'); if(X) X.value=x; if(Y) Y.value=y; playSelectSound(); }
    window.coordPick = coordPick;
    function coordKey(e){ if (e.key === 'Enter'){ e.preventDefault(); coordFire(); } }
    window.coordKey = coordKey;

    function coordFire(){
      const c = state.coord, lv = COORD_LEVELS[c.levelIndex], R = lv.range;
      if (c.won || c.lost) return;
      const X=document.getElementById('coord-x'), Y=document.getElementById('coord-y');
      const xi=parseInt(X&&X.value,10), yi=parseInt(Y&&Y.value,10);
      if (isNaN(xi) || isNaN(yi) || xi<-R || xi>R || yi<-R || yi>R) { c.message='⛔ −'+R+'…+'+R; playTone('G3','sine','16n'); render(); return; }
      c.ammo = Math.max(0, c.ammo - 1);

      if (lv.mode === 'read') {
        const tg = c.targets[c.targetIndex];
        if (tg && xi===tg.x && yi===tg.y) {
          tg.sunk=true; c.targetIndex++;
          if (c.targetIndex >= c.targets.length) { c.won=true; c.message=t('winMsg'); coordCelebrate(); }
          else { c.message=t('sunkMsg'); playHitSound(); coordImpactFX('hit'); }
        } else { c.message=t('wrongCoordMsg'); playSplashSound(); coordImpactFX('miss'); }
        if (!c.won && c.ammo<=0) { c.lost=true; c.message=t('outOfAmmoMsg'); }
        render(); if (c.won) coordImpactFX('hit'); return;
      }

      // mühimmat gemisi → cephane dolar
      if (c.supply && !c.supply.found && xi===c.supply.x && yi===c.supply.y) {
        c.supply.found=true; c.ammo=c.maxAmmo; c.message=t('supplyMsg'); playRewardSound();
        if (!c.shots.some(s=>s.x===xi&&s.y===yi)) c.shots.push({x:xi,y:yi,supply:true});
        render(); coordImpactFX('hit'); return;
      }

      const dup = c.shots.some(s=>s.x===xi && s.y===yi);
      let hit=false, justSunk=false;
      for (const sh of c.ships){
        for (let k=0;k<sh.cells.length;k++){
          if (sh.cells[k].x===xi && sh.cells[k].y===yi){
            if (!sh.hits[k]) sh.hits[k]=true;
            hit=true;
            if (!sh.sunk && sh.hits.every(Boolean)) { sh.sunk=true; justSunk=true; }
          }
        }
      }
      if (!dup) c.shots.push({x:xi,y:yi,hit});
      if (c.ships.every(s=>s.sunk)) { c.won=true; c.message = lv.mode==='mine' ? t('defuseMsg') : t('winMsg'); if(lv.mode==='mine') coordClearTimer(); coordCelebrate(); }
      else if (c.ammo<=0) { c.lost=true; c.message=t('outOfAmmoMsg'); if(lv.mode==='mine') coordClearTimer(); playSplashSound(); }
      else { c.message = hit ? (justSunk ? t('sunkMsg') : t('hitMsg')) : t('missMsg'); if(hit){ playHitSound(); } else { playSplashSound(); } }
      render();
      coordImpactFX(hit ? 'hit' : 'miss');
    }
    window.coordFire = coordFire;

    function starPts(cxp,cyp,outer,inner,spikes){
      let pts=[];
      for(let i=0;i<spikes*2;i++){ const r=i%2?inner:outer; const a=(Math.PI/spikes)*i - Math.PI/2; pts.push((cxp+r*Math.cos(a)).toFixed(1)+','+(cyp+r*Math.sin(a)).toFixed(1)); }
      return pts.join(' ');
    }
    function buildCoordSVG(){
      const c=state.coord, lv=COORD_LEVELS[c.levelIndex], R=lv.range;
      const U = R<=5?40:30, pad=30, VB=2*R*U+2*pad, C=VB/2;
      const cx=x=>C+x*U, cy=y=>C-y*U;
      let g='';
      for (let i=-R;i<=R;i++){
        g+=`<line x1="${cx(i)}" y1="${cy(-R)}" x2="${cx(i)}" y2="${cy(R)}" stroke="#e2e8f0" stroke-width="1"/>`;
        g+=`<line x1="${cx(-R)}" y1="${cy(i)}" x2="${cx(R)}" y2="${cy(i)}" stroke="#e2e8f0" stroke-width="1"/>`;
      }
      g+=`<line x1="${cx(-R)}" y1="${cy(0)}" x2="${cx(R)}" y2="${cy(0)}" stroke="#475569" stroke-width="2.5"/>`;
      g+=`<line x1="${cx(0)}" y1="${cy(-R)}" x2="${cx(0)}" y2="${cy(R)}" stroke="#475569" stroke-width="2.5"/>`;
      g+=`<text x="${cx(R)+12}" y="${cy(0)+4}" font-size="14" font-weight="700" fill="#475569">x</text>`;
      g+=`<text x="${cx(0)-2}" y="${cy(R)-12}" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">y</text>`;
      for (let i=-R;i<=R;i++){ if (i===0) continue;
        g+=`<text x="${cx(i)}" y="${cy(0)+16}" font-size="10" fill="#94a3b8" text-anchor="middle">${i}</text>`;
        g+=`<text x="${cx(0)-8}" y="${cy(i)+4}" font-size="10" fill="#94a3b8" text-anchor="end">${i}</text>`;
      }
      g+=`<text x="${cx(0)-8}" y="${cy(0)+16}" font-size="10" fill="#94a3b8" text-anchor="end">0</text>`;

      if (lv.mode!=='read'){
        for (let x=-R;x<=R;x++) for (let y=-R;y<=R;y++)
          g+=`<circle cx="${cx(x)}" cy="${cy(y)}" r="${U*0.42}" fill="transparent" class="coord-pt" onclick="coordPick(${x},${y})"/>`;
        if (lv.mode==='mine' && c.userPts){
          [1,2].forEach(li=>{
            const col = li===1 ? '#2563eb' : '#10b981';
            const pts = c.userPts[li].map(p=>({x:parseInt(p.x,10),y:parseInt(p.y,10)}))
              .filter(p=>Number.isInteger(p.x)&&Number.isInteger(p.y)&&p.x>=-R&&p.x<=R&&p.y>=-R&&p.y<=R);
            if (pts.length>=2 && !(pts[0].x===pts[1].x && pts[0].y===pts[1].y)){
              const a=pts[0], b=pts[1];
              if (a.x===b.x) g+=`<line x1="${cx(a.x)}" y1="${cy(-R)}" x2="${cx(a.x)}" y2="${cy(R)}" stroke="${col}" stroke-width="3" opacity="0.75"/>`;
              else { const m=(b.y-a.y)/(b.x-a.x), bb=a.y-m*a.x; g+=`<line x1="${cx(-R)}" y1="${cy(m*(-R)+bb)}" x2="${cx(R)}" y2="${cy(m*R+bb)}" stroke="${col}" stroke-width="3" opacity="0.75"/>`; }
            }
            pts.forEach(p=>{ g+=`<circle cx="${cx(p.x)}" cy="${cy(p.y)}" r="${U*0.17}" fill="${col}" stroke="#fff" stroke-width="1.5"/>`; });
          });
        }
        for (const sh of c.ships) if (sh.sunk) for (const ce of sh.cells){
          if (lv.mode==='mine') g+=`<text x="${cx(ce.x)}" y="${cy(ce.y)+U*0.22}" font-size="${U*0.7}" text-anchor="middle">💥</text>`;
          else g+=`<rect x="${cx(ce.x)-U*0.34}" y="${cy(ce.y)-U*0.34}" width="${U*0.68}" height="${U*0.68}" rx="4" fill="#334155" opacity="0.85"/>`;
        }
        c.shots.forEach((s,si)=>{
          const last = si===c.shots.length-1;
          if (s.supply) g+=`<text x="${cx(s.x)}" y="${cy(s.y)+U*0.2}" font-size="${U*0.6}" text-anchor="middle"${last?' class="coord-boom"':''}>📦</text>`;
          else if (s.hit) g+=`<g${last?' class="coord-boom"':''}><polygon points="${starPts(cx(s.x),cy(s.y),U*0.52,U*0.22,8)}" fill="#f59e0b" opacity="0.95"/><circle cx="${cx(s.x)}" cy="${cy(s.y)}" r="${U*0.3}" fill="#ef4444"/><text x="${cx(s.x)}" y="${cy(s.y)+5}" font-size="14" fill="#fff" text-anchor="middle" font-weight="900">✕</text></g>`;
          else g+=`<circle cx="${cx(s.x)}" cy="${cy(s.y)}" r="${U*0.26}" fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0.85"/>`;
        });
      } else {
        c.targets.forEach((tg,i)=>{
          if (tg.sunk) g+=`<g><circle cx="${cx(tg.x)}" cy="${cy(tg.y)}" r="${U*0.3}" fill="#10b981"/><text x="${cx(tg.x)}" y="${cy(tg.y)+5}" font-size="13" fill="#fff" text-anchor="middle" font-weight="900">✓</text></g>`;
          else if (i===c.targetIndex) g+=`<g class="coord-target"><circle cx="${cx(tg.x)}" cy="${cy(tg.y)}" r="${U*0.4}" fill="#f59e0b"/><circle cx="${cx(tg.x)}" cy="${cy(tg.y)}" r="${U*0.16}" fill="#fff"/></g>`;
        });
      }
      const maxW = R<=5?440:540;
      return `<svg viewBox="0 0 ${VB} ${VB}" style="width:100%;height:auto;max-width:${maxW}px" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
    }

    function renderCoordTab(){
      const c=state.coord;
      if (!c._init) coordGen();
      const lv=COORD_LEVELS[c.levelIndex];
      const levelBtns = COORD_LEVELS.map((L,i)=>`<button onClick="coordSetLevel(${i})" class="focusable w-8 h-8 rounded-lg font-extrabold text-sm transition ${i===c.levelIndex?'bg-indigo-600 text-white shadow':'bg-slate-100 text-slate-500 hover:bg-slate-200'}">${i+1}</button>`).join('');
      const hint = lv.mode==='read' ? t('readHint') : (lv.mode==='mine' ? t('mineHint') : t('enterHint'));
      const over = c.won || c.lost;
      if (lv.mode==='mine' && !over && !c.timerId) coordStartTimer();
      if (lv.mode!=='mine' || over) coordClearTimer();
      let ammoIcons=''; for (let i=0;i<c.maxAmmo;i++) ammoIcons += `<span class="text-sm ${i<c.ammo?'':'opacity-20 grayscale'}">💣</span>`;
      const timerPill = lv.mode==='mine' ? `<span id="coord-timer" class="text-lg md:text-xl font-black ${c.timeLeft<=15?'text-rose-600':'text-slate-700'} bg-slate-100 px-4 py-2 rounded-2xl shadow-sm tabular-nums">⏱ ${coordFmt(c.timeLeft)}</span>` : '';
      const valTables = (lv.mode==='mine' && c.userPts && !over) ? `
        <div class="grid grid-cols-2 gap-2 mb-2">
          ${[1,2].map(li=>`
            <div class="bg-white border ${li===1?'border-blue-200':'border-emerald-200'} rounded-xl p-2">
              <div class="text-[11px] font-bold ${li===1?'text-blue-700':'text-emerald-700'} mb-1.5" dir="ltr">${t('lineLabel')} ${li}: ${c.mineEqs[li-1]||''}</div>
              ${[0,1].map(ri=>`<div class="flex items-center gap-1 mb-1 justify-center" dir="ltr">
                <span class="text-[10px] text-slate-400">x</span><input type="number" value="${c.userPts[li][ri].x}" oninput="coordPlotInput(${li},${ri},'x',this.value)" class="focusable w-11 rounded-lg border ${li===1?'border-blue-200':'border-emerald-200'} outline-none px-1 py-1 text-center text-sm font-bold text-slate-800">
                <span class="text-[10px] text-slate-400">y</span><input type="number" value="${c.userPts[li][ri].y}" oninput="coordPlotInput(${li},${ri},'y',this.value)" class="focusable w-11 rounded-lg border ${li===1?'border-blue-200':'border-emerald-200'} outline-none px-1 py-1 text-center text-sm font-bold text-slate-800">
              </div>`).join('')}
            </div>`).join('')}
        </div>
        <p class="text-center text-[11px] text-slate-400 mb-2">${t('valTableHint')}</p>` : '';
      const mineBox = lv.mode==='mine' ? `
        <div class="bg-purple-50 border border-purple-200 rounded-2xl p-3 mb-3 text-center">
          <div class="flex flex-col gap-1 items-center" dir="ltr">
            ${c.mineEqs.map(e=>`<span class="text-lg font-black text-purple-900">${e}</span>`).join('')}
          </div>
          <div class="flex items-center justify-center gap-4 mt-2">
            <button onClick="coordToggleHelp()" class="focusable text-xs font-bold text-purple-700 underline decoration-dotted">${t('helpBtn')}</button>
            <button onClick="coordToggleSolve()" class="focusable text-xs font-bold text-purple-700 underline decoration-dotted">${t('solveBtn')}</button>
          </div>
          ${c.showHelp?`<div class="text-[11px] text-purple-800 mt-2 text-start leading-relaxed bg-white/70 rounded-xl p-2">${t('mineHelp')}</div>`:''}
          ${c.showSolve?`<div class="mt-2 text-start bg-white/70 rounded-xl p-2"><div class="text-[11px] text-purple-800 mb-1">${t('solveIntro')}</div><div class="font-mono text-sm text-purple-900 leading-relaxed" dir="ltr">${coordSolveSteps()}</div></div>`:''}
        </div>` : '';
      return `
        <div class="bg-gradient-to-br from-indigo-50 to-purple-50 p-5 rounded-3xl border border-indigo-100/80 shadow-sm mb-6">
          <h2 class="text-xl font-extrabold text-slate-800 flex items-center gap-2">🎯 ${t('tabCoord')}</h2>
          <p class="text-xs text-slate-500 mt-1">${t('coordSub')}</p>
        </div>
        <div class="bg-white border border-slate-200 p-4 md:p-5 rounded-3xl shadow-sm">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
            <div class="flex items-center gap-1.5"><span class="text-xs font-bold text-slate-500 me-1">${t('coordLevelLabel')}</span>${levelBtns}</div>
            <div class="flex items-center gap-1 flex-wrap">${timerPill}<span class="text-xs font-bold text-slate-500 me-1 ms-1">${t('ammoLabel')}</span><span class="flex flex-wrap gap-0.5">${ammoIcons}</span><span class="text-xs font-extrabold text-slate-700 ms-1">(${c.ammo})</span></div>
          </div>
          <div class="bg-indigo-50/70 border border-indigo-100 rounded-xl px-3 py-2 mb-3 text-[11px] text-indigo-900 leading-relaxed">${t('lvl'+(c.levelIndex+1)+'Desc')}</div>
          ${mineBox}
          <p class="text-center text-sm font-semibold text-indigo-700 mb-2" dir="ltr">${hint}</p>
          ${valTables}
          <div id="coord-plane" class="flex justify-center overflow-auto bg-slate-50 rounded-2xl border border-slate-100 p-2">${buildCoordSVG()}</div>
          <div class="text-center min-h-[28px] my-2 text-base font-extrabold ${c.won?'text-emerald-600':(c.lost?'text-rose-600':'text-slate-700')}">${c.message}</div>
          <div class="flex flex-wrap items-end justify-center gap-2" dir="ltr">
            <label class="flex flex-col items-center text-[11px] font-bold text-slate-500">x<input id="coord-x" type="number" ${over?'disabled':''} onkeydown="coordKey(event)" class="focusable w-16 mt-0.5 rounded-xl border-2 border-slate-200 focus:border-indigo-400 outline-none px-2 py-2 text-center text-lg font-black text-slate-800 disabled:opacity-40"></label>
            <label class="flex flex-col items-center text-[11px] font-bold text-slate-500">y<input id="coord-y" type="number" ${over?'disabled':''} onkeydown="coordKey(event)" class="focusable w-16 mt-0.5 rounded-xl border-2 border-slate-200 focus:border-indigo-400 outline-none px-2 py-2 text-center text-lg font-black text-slate-800 disabled:opacity-40"></label>
            <button onClick="coordFire()" ${over?'disabled':''} class="focusable px-5 py-2.5 bg-gradient-to-r from-rose-500 to-orange-500 hover:from-rose-600 hover:to-orange-600 text-white font-extrabold rounded-xl shadow-md transition active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed">${t('fireBtn')}</button>
            ${c.won?`<button onClick="coordNext()" class="focusable px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition">${t('nextLevelBtn')}</button>`:''}
            <button onClick="coordReset()" class="focusable px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl transition">${t('resetBtn')}</button>
          </div>
          ${lv.mode!=='read'?`<p class="text-center text-[11px] text-slate-400 mt-3">${t('clickHint')}</p>`:''}
        </div>`;
    }
    window.renderCoordTab = renderCoordTab;
  </script>

  <script>
    /* ===================== EKSİK TABLO (doldurma oyunu) ===================== */
    const FILL_LEVELS = [ {size:5, blanks:6}, {size:8, blanks:12}, {size:10, blanks:18} ];

    function fillGen(){
      const f=state.fill, lv=FILL_LEVELS[f.levelIndex], n=lv.size;
      f.size=n; f.blanks={}; f.values={}; f.solved={}; f.done=false;
      const keys=[]; for(let r=1;r<=n;r++) for(let c=1;c<=n;c++) keys.push(r+','+c);
      for(let i=keys.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [keys[i],keys[j]]=[keys[j],keys[i]]; }
      keys.slice(0, Math.min(lv.blanks, keys.length)).forEach(k=>f.blanks[k]=true);
      f._init=true;
    }
    function fillSetLevel(i){ state.fill.levelIndex=i; fillGen(); render(); }
    window.fillSetLevel = fillSetLevel;
    function fillNew(){ fillGen(); render(); }
    window.fillNew = fillNew;
    function fillInput(r,c,val){
      const f=state.fill, key=r+','+c, correct=r*c;
      val=String(val).replace(/[^0-9]/g,''); f.values[key]=val;
      if(parseInt(val,10)===correct){
        f.solved[key]=true; playHitSound();
        const total=Object.keys(f.blanks).length, done=Object.keys(f.solved).length;
        if(done>=total){ f.done=true; coordCelebrate(); }
        render();
      } else if(val.length>=String(correct).length){
        const el=document.getElementById('fill-'+key);
        if(el){ el.classList.remove('fill-wrong'); void el.offsetWidth; el.classList.add('fill-wrong'); }
        playSplashSound();
      }
    }
    window.fillInput = fillInput;

    function renderFillTab(){
      const f=state.fill;
      if(!f._init) fillGen();
      const n=f.size;
      const total=Object.keys(f.blanks).length, done=Object.keys(f.solved).length;
      const levelBtns = FILL_LEVELS.map((L,i)=>`<button onClick="fillSetLevel(${i})" class="focusable w-8 h-8 rounded-lg font-extrabold text-sm transition ${i===f.levelIndex?'bg-indigo-600 text-white shadow':'bg-slate-100 text-slate-500 hover:bg-slate-200'}">${i+1}</button>`).join('');
      let g='';
      g+=`<div class="cell-size bg-slate-800 text-white font-black flex items-center justify-center rounded-lg select-none">×</div>`;
      for(let c=1;c<=n;c++) g+=`<div class="cell-size bg-indigo-100 text-indigo-800 font-bold flex items-center justify-center rounded-lg select-none">${c}</div>`;
      for(let r=1;r<=n;r++){
        g+=`<div class="cell-size bg-indigo-100 text-indigo-800 font-bold flex items-center justify-center rounded-lg select-none">${r}</div>`;
        for(let c=1;c<=n;c++){ const key=r+','+c, prod=r*c;
          if(f.blanks[key]){
            if(f.solved[key]) g+=`<div class="cell-size bg-emerald-500 text-white font-black flex items-center justify-center rounded-lg select-none">${prod}</div>`;
            else g+=`<input id="fill-${key}" inputmode="numeric" value="${f.values[key]||''}" oninput="fillInput(${r},${c},this.value)" maxlength="3" class="cell-size fill-input text-center font-black rounded-lg border-2 border-amber-300 bg-amber-50 text-slate-800 outline-none focus:border-indigo-500">`;
          } else {
            g+=`<div class="cell-size bg-slate-50 text-slate-400 font-semibold flex items-center justify-center rounded-lg select-none">${prod}</div>`;
          }
        }
      }
      return `
        <div class="bg-gradient-to-br from-indigo-50 to-purple-50 p-5 rounded-3xl border border-indigo-100/80 shadow-sm mb-6">
          <h2 class="text-xl font-extrabold text-slate-800 flex items-center gap-2">${getIcon('grid3x3','w-5 h-5')} ${t('tabFill')}</h2>
          <p class="text-xs text-slate-500 mt-1">${t('fillSub')}</p>
        </div>
        <div class="bg-white border border-slate-200 p-4 md:p-5 rounded-3xl shadow-sm">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
            <div class="flex items-center gap-1.5"><span class="text-xs font-bold text-slate-500 me-1">${t('coordLevelLabel')}</span>${levelBtns}</div>
            <span class="text-xs font-extrabold ${f.done?'text-emerald-600':'text-slate-600'} bg-slate-100 px-3 py-1.5 rounded-full">${t('fillProgress')}: ${done}/${total}</span>
          </div>
          <div class="w-full overflow-x-auto flex items-start pb-2" style="justify-content:safe center;">
            <div class="grid gap-1 p-2 bg-white rounded-2xl shadow-sm border border-slate-100" style="grid-template-columns:repeat(${n+1},max-content); min-width:max-content;" dir="ltr">${g}</div>
          </div>
          <div class="text-center min-h-[28px] my-2 text-base font-extrabold ${f.done?'text-emerald-600':'text-transparent'}">${f.done?t('fillWinMsg'):'.'}</div>
          <div class="flex justify-center">
            <button onClick="fillNew()" class="focusable px-5 py-2.5 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-extrabold rounded-xl shadow-md transition active:scale-95 flex items-center gap-2 text-sm">${getIcon('refresh','w-4 h-4')} ${t('newGameBtn')}</button>
          </div>
        </div>`;
    }
    window.renderFillTab = renderFillTab;
  </script>

  <script>
    /* ===================== ANA RENDER ===================== */
    function render() {
      applyDir();
      const app = document.getElementById('app');
      const langOptions = LANGS.map(l => `<option value="${l}" style="color:#1e293b;background:#ffffff;font-weight:700" ${state.lang===l?'selected':''}>${I18N[l].ui.langName}</option>`).join('');

      app.innerHTML = `
        <div class="bg-gradient-to-r from-indigo-700 via-purple-700 to-pink-700 p-5 md:p-6 text-white text-center shadow-inner">
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-1.5 bg-white/15 rounded-xl px-2 py-1.5 backdrop-blur shrink-0">
              ${getIcon('globe','w-4 h-4 text-white/90')}
              <select onchange="setLang(this.value)" aria-label="${t('langSelect')}" class="focusable bg-transparent text-white text-xs font-bold outline-none cursor-pointer">
                ${langOptions}
              </select>
            </div>
            <div class="animate-spin-slow text-yellow-300 shrink-0">${getIcon('sparkles','w-7 h-7')}</div>
          </div>
          <h1 class="text-2xl sm:text-3xl md:text-4xl font-black mb-1 flex justify-center items-center gap-2 tracking-tight">${getIcon('brain','w-7 h-7 md:w-8 md:h-8 text-yellow-300 shrink-0')} <span>${t('appTitle')}</span></h1>
          <p class="text-indigo-100 opacity-90 text-xs sm:text-sm md:text-base max-w-xl mx-auto font-medium">${t('appSubtitle')}</p>
          <div class="flex flex-wrap justify-center gap-2 mt-5">
            <button onClick="setTab('kesif')" class="focusable flex items-center gap-2 px-5 py-2.5 rounded-xl font-extrabold text-sm transition-all duration-200 ${(state.tab==='kesif'||state.tab==='detay') ? 'bg-white text-indigo-700 shadow-lg scale-105' : 'bg-white/10 text-white hover:bg-white/20'}">${getIcon('grid3x3','w-4 h-4')} ${t('tabDiscovery')}</button>
            <button onClick="setTab('strateji')" class="focusable flex items-center gap-2 px-5 py-2.5 rounded-xl font-extrabold text-sm transition-all duration-200 ${state.tab==='strateji' ? 'bg-white text-indigo-700 shadow-lg scale-105' : 'bg-white/10 text-white hover:bg-white/20'}">${getIcon('brain','w-4 h-4')} ${t('tabStrategy')}</button>
            <button onClick="setTab('koord')" class="focusable flex items-center gap-2 px-5 py-2.5 rounded-xl font-extrabold text-sm transition-all duration-200 ${state.tab==='koord' ? 'bg-white text-indigo-700 shadow-lg scale-105' : 'bg-white/10 text-white hover:bg-white/20'}">${getIcon('compass','w-4 h-4')} ${t('tabCoord')}</button>
            <button onClick="setTab('doldur')" class="focusable flex items-center gap-2 px-5 py-2.5 rounded-xl font-extrabold text-sm transition-all duration-200 ${state.tab==='doldur' ? 'bg-white text-indigo-700 shadow-lg scale-105' : 'bg-white/10 text-white hover:bg-white/20'}">${getIcon('grid3x3','w-4 h-4')} ${t('tabFill')}</button>
          </div>
        </div>
        <div class="p-4 md:p-6">${state.tab === 'kesif' ? renderDiscoveryTab() : (state.tab === 'detay' ? renderDetailView() : (state.tab === 'koord' ? renderCoordTab() : (state.tab === 'doldur' ? renderFillTab() : renderStrategyTab())))}</div>
      `;

      if (state.tab === 'kesif') {
        updateTableHighlights();
        setTimeout(window.adjustVerticalSliderWidth, 50);
        setTimeout(window.syncInteractiveTable, 10);
      }
    }

    function renderDetailView() {
      const r = state.activeGridRows, c = state.activeGridCols;
      const product = (r != null && c != null) ? r * c : 0;
      const arrow = (state.lang === 'ar') ? '→' : '←';
      return `
        <div>
          <div class="flex items-center justify-between gap-3 mb-5 flex-wrap">
            <button onClick="backToTable()" class="focusable inline-flex items-center gap-2 px-4 py-2 rounded-full bg-slate-100 text-slate-700 font-bold text-sm hover:bg-slate-200 transition">${arrow} ${t('backToTable')}</button>
            <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-indigo-600 text-white font-black text-base shadow-sm" dir="ltr">${r} × ${c} = ${product}</div>
          </div>
          ${renderDetailsPanelContent(product)}
        </div>`;
    }

    function toggleFocusMode(){ state.focusMode = !state.focusMode; render(); }
    window.toggleFocusMode = toggleFocusMode;
    function renderDiscoveryTab() {
      let gridHtml = '';
      gridHtml += `<div class="cell-size"></div><div class="cell-size"></div>`;
      gridHtml += `<div class="col-span-10 flex items-center px-1.5 py-1"><input type="range" min="1" max="10" id="horizontal-range-input" value="${state.selectedCol ?? 5}" oninput="handleHorizontalSlider(this.value)" class="custom-slider w-full h-3.5 rounded-full cursor-pointer focus:outline-none shadow-md" aria-label="${t('col')}"></div>`;

      gridHtml += `<div class="cell-size"></div>`;
      gridHtml += `<div class="cell-size bg-slate-800 text-white rounded-lg text-sm md:text-base font-black flex items-center justify-center select-none shadow-sm">×</div>`;
      for (let c = 1; c <= 10; c++)
        gridHtml += `<button type="button" id="th-col-${c}" onClick="selectHeader('col', ${c})" class="focusable cell-size cursor-pointer rounded-xl text-slate-600 font-bold flex items-center justify-center select-none" aria-label="${t('ariaSelectCol',{n:c})}">${c}</button>`;

      for (let r = 1; r <= 10; r++) {
        if (r === 1) gridHtml += `<div class="vertical-slider-container" style="grid-row: span 10; height:100%;"><input type="range" min="1" max="10" id="vertical-range-input" value="${11-(state.selectedRow ?? 5)}" oninput="handleVerticalSlider(this.value)" class="custom-slider cursor-pointer focus:outline-none" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) rotate(270deg); z-index:30;" aria-label="${t('row')}"></div>`;
        gridHtml += `<button type="button" id="th-row-${r}" onClick="selectHeader('row', ${r})" class="focusable cell-size cursor-pointer rounded-xl text-slate-600 font-bold flex items-center justify-center select-none" aria-label="${t('ariaSelectRow',{n:r})}">${r}</button>`;
        for (let c = 1; c <= 10; c++) {
          const val = r * c;
          gridHtml += `<button type="button" data-row="${r}" data-col="${c}" onmouseenter="setHoveredCell(${r}, ${c})" onmouseleave="clearHoveredCell()" onfocus="setHoveredCell(${r}, ${c})" onblur="clearHoveredCell()" onclick="selectCellDirectly(${r}, ${c})" class="table-cell focusable cell-size cursor-pointer rounded-lg border flex items-center justify-center select-none" aria-label="${t('ariaCell',{r:r,c:c,v:val})}">${val}</button>`;
        }
      }

      const both = state.selectedRow !== null && state.selectedCol !== null;
      const resVal = both ? state.selectedRow * state.selectedCol : '?';

      return `
        <div class="mb-6 bg-gradient-to-br from-indigo-950 via-slate-900 to-purple-950 text-white rounded-3xl p-6 shadow-2xl border border-indigo-500/30 relative overflow-hidden flex flex-col items-center justify-center magic-glow">
          <div class="absolute -start-10 -top-10 w-40 h-40 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>
          <div class="absolute -end-10 -bottom-10 w-40 h-40 bg-pink-500/20 rounded-full blur-3xl pointer-events-none"></div>
          <div class="text-center mb-4"><span class="text-[10px] uppercase tracking-widest text-indigo-300 font-bold">${t('consoleLabel')}</span></div>
          <div class="flex items-center justify-center gap-3 sm:gap-6 bg-white/5 backdrop-blur-md px-6 py-4 rounded-2xl border border-white/10 shadow-lg relative z-10 w-full max-w-lg">
            <div class="flex flex-col items-center justify-center bg-gradient-to-br from-sky-400 to-blue-600 border border-sky-300/40 px-4 py-2.5 rounded-xl shadow-lg min-w-[70px]">
              <span class="text-[9px] text-sky-50 font-bold uppercase tracking-wider">${t('row')}</span>
              <span id="formula-row-display" class="text-2xl md:text-3xl font-black text-white drop-shadow">${state.selectedRow ?? '?'}</span>
            </div>
            <span class="text-2xl md:text-3xl font-black text-indigo-400 select-none">×</span>
            <div class="flex flex-col items-center justify-center bg-gradient-to-br from-pink-400 to-fuchsia-600 border border-pink-300/40 px-4 py-2.5 rounded-xl shadow-lg min-w-[70px]">
              <span class="text-[9px] text-pink-50 font-bold uppercase tracking-wider">${t('col')}</span>
              <span id="formula-col-display" class="text-2xl md:text-3xl font-black text-white drop-shadow">${state.selectedCol ?? '?'}</span>
            </div>
            <span class="text-2xl md:text-3xl font-black text-purple-400 select-none">=</span>
            <div class="flex flex-col items-center justify-center bg-gradient-to-br from-amber-400 to-orange-500 text-slate-950 font-black px-5 py-3 rounded-xl shadow-lg min-w-[80px] neon-pulse">
              <span class="text-[9px] text-slate-900/80 font-black uppercase tracking-wider">${t('result')}</span>
              <span id="formula-res-display" class="text-2xl md:text-3xl font-black">${resVal}</span>
            </div>
          </div>
          <div class="mt-5 relative z-10 flex flex-wrap items-center justify-center gap-2">
            <button id="speak-btn" onClick="speakOperation()" class="focusable px-5 py-2.5 bg-white/10 hover:bg-white/20 border border-white/25 text-white font-extrabold rounded-full shadow-lg transition-all active:scale-95 flex items-center gap-2 text-xs">${getIcon('volume2','w-4 h-4')} ${t('readBtn')}</button>
            <button id="toggle-details-btn" onClick="openDetails()" class="focusable px-6 py-2.5 bg-gradient-to-r from-pink-500 via-purple-600 to-indigo-600 hover:from-pink-600 hover:to-indigo-700 text-white font-extrabold rounded-full shadow-lg transition-all active:scale-95 flex items-center gap-2 text-xs">${getIcon('compass','w-4 h-4')} ${t('detailsShow',{n:resVal})}</button>
            <button id="focus-btn" onClick="toggleFocusMode()" class="focusable px-5 py-2.5 ${state.focusMode?'bg-white/25 border-white/40':'bg-white/10 border-white/25'} hover:bg-white/20 border text-white font-extrabold rounded-full shadow-lg transition-all active:scale-95 flex items-center gap-2 text-xs">🎯 ${t('focusModeLabel')} <span class="${state.focusMode?'text-emerald-300':'text-slate-400'}">${state.focusMode?'●':'○'}</span></button>
          </div>
        </div>

        <div class="bg-white p-3 md:p-5 rounded-3xl border border-slate-200 shadow-sm flex flex-col items-center overflow-hidden">
          <div class="w-full overflow-x-auto flex items-start pb-2" style="justify-content:safe center;">
            <div class="grid grid-cols-12 gap-1 p-2 bg-white rounded-2xl shadow-sm border border-slate-100" style="min-width:max-content;" dir="ltr">${gridHtml}</div>
          </div>
          <div class="mt-5 flex flex-wrap gap-4 justify-center text-[11px] md:text-xs text-slate-500 font-semibold bg-slate-50 px-4 py-2.5 rounded-full border border-slate-100">
            <span class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 bg-blue-100 border border-blue-200 rounded-md"></span> ${t('legendEasy')}</span>
            <span class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 bg-green-100 border border-green-200 rounded-md"></span> ${t('legendMedium')}</span>
            <span class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 bg-rose-100 border border-rose-200 rounded-md"></span> ${t('legendAdvanced')}</span>
            <span class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 bg-amber-200 border border-amber-300 rounded-md"></span> ${t('legendSquare')}</span>
            <span class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 bg-gradient-to-br from-amber-400 to-orange-500 rounded-md"></span> ${t('legendLocked')}</span>
          </div>
        </div>
        <div id="details-panel-container" class="hidden"></div>

      `;
    }

    function renderStrategyTab() {
      const problem = state.workshopProblem;
      const MODES = [ {key:'add', icon:'＋', label:t('modeAdd')}, {key:'mult', icon:'×', label:t('modeMult')} ];
      const modeButtons = MODES.map(m => {
        const a = state.workshopMode === m.key;
        return `<button onClick="setWorkshopMode('${m.key}')" class="focusable flex items-center gap-2 px-4 py-2.5 rounded-full text-xs sm:text-sm font-bold border transition-all ${a ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm scale-105' : 'bg-white text-slate-500 border-slate-200 hover:border-indigo-300'}"><span class="text-base font-bold">${m.icon}</span> ${m.label}</button>`;
      }).join('');

      let feedbackHtml = '';
      if (state.checked) {
        if (state.isCorrect) {
          feedbackHtml = `<div class="mt-4 rounded-2xl border border-emerald-200 bg-emerald-50/90 p-4 flex items-center gap-3 shadow-sm"><div class="w-12 h-12 shrink-0 rounded-full bg-emerald-500 text-white flex items-center justify-center shadow">${getIcon('check','w-6 h-6')}</div><div><p class="font-extrabold text-emerald-900 text-base">${t('correctTitle')}</p><p class="text-emerald-800 text-xs md:text-sm">${t('correctBody',{op:problem.text, ans:problem.answer})}</p></div></div>`;
        } else {
          feedbackHtml = `<div class="mt-4 rounded-2xl border border-amber-200 bg-amber-50/90 p-4 flex items-center gap-3 shadow-sm"><div class="w-12 h-12 shrink-0 rounded-full bg-amber-500 text-white flex items-center justify-center shadow">${getIcon('info','w-6 h-6')}</div><div><p class="font-extrabold text-amber-900 text-base">${t('wrongTitle')}</p><p class="text-amber-800 text-xs md:text-sm">${t('wrongBody')}</p></div></div>`;
        }
      }

      let methodsHtml = '';
      if (state.showMethods) {
        const palettes = [
          {bg:'from-sky-50 to-blue-50', border:'border-sky-200', chip:'bg-sky-500', head:'text-sky-900'},
          {bg:'from-pink-50 to-fuchsia-50', border:'border-pink-200', chip:'bg-pink-500', head:'text-pink-900'},
          {bg:'from-amber-50 to-orange-50', border:'border-amber-200', chip:'bg-amber-500', head:'text-amber-900'}
        ];
        const cards = getMethods(problem).map((mth, i) => {
          const p = palettes[i % palettes.length];
          const stepsHtml = mth.steps.map((step, idx) => {
            const isLast = idx === mth.steps.length - 1;
            const lead = leadText(step);
            const expr = step.expr ? `<span dir="ltr" class="inline-block">${step.expr}</span>` : '';
            const text = lead + ((lead && expr) ? ' ' : '') + expr;
            return `<div class="flex items-start gap-2.5"><span class="mt-0.5 w-5 h-5 shrink-0 ${isLast ? p.chip+' text-white' : 'bg-white border '+p.border+' text-slate-500'} font-bold rounded-full flex items-center justify-center text-[10px]">${isLast ? getIcon('check','w-3 h-3') : (idx+1)}</span><span class="text-xs md:text-sm leading-relaxed ${isLast ? 'font-extrabold text-slate-900' : 'font-semibold text-slate-700'}">${text}</span></div>`;
          }).join('');
          return `<div class="bg-gradient-to-br ${p.bg} border ${p.border} rounded-2xl p-4 shadow-sm"><h4 class="font-extrabold ${p.head} text-sm mb-3 flex items-center gap-2"><span class="text-lg">${mth.icon}</span> ${mth.name}</h4><div class="space-y-2">${stepsHtml}</div></div>`;
        }).join('');
        methodsHtml = `<div class="mt-6 border-t border-slate-150 pt-6"><h3 class="font-extrabold text-slate-800 mb-1 flex items-center gap-2 text-sm md:text-base">${getIcon('lightbulb','w-5 h-5 text-indigo-600')} ${t('methodsHeader')}</h3><p class="text-xs text-slate-500 mb-4">${t('methodsSub')}</p><div class="grid grid-cols-1 md:grid-cols-3 gap-3">${cards}</div></div>`;
      }

      const checkDisabled = state.userResult.trim() === '';

      return `
        <div class="bg-gradient-to-br from-indigo-50 to-purple-50 p-5 rounded-3xl border border-indigo-100/80 shadow-sm mb-6">
          <h2 class="text-xl font-extrabold text-slate-800 flex items-center gap-2">🧠 ${t('tabStrategy')}</h2>
          <p class="text-xs text-slate-500 mt-1">${t('workshopSubtitle')}</p>
        </div>
        <div class="bg-white border border-slate-200 p-5 rounded-3xl shadow-sm">
          <div class="flex flex-wrap justify-start gap-2 mb-6 border-b border-slate-100 pb-5">${modeButtons}</div>
          <div class="flex items-center justify-between mb-4">
            <div><span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">${t('targetOp')}</span><h3 class="text-3xl font-black text-indigo-950 tracking-tight mt-0.5" dir="ltr">${problem.text}</h3></div>
            <button onClick="refreshWorkshopProblem()" class="focusable p-2.5 rounded-xl border border-slate-200 text-slate-500 hover:text-indigo-600 hover:border-indigo-300 transition" aria-label="${t('newProblem')}" title="${t('newProblem')}">${getIcon('refresh','w-5 h-5')}</button>
          </div>
          <label class="block text-xs font-bold text-slate-500 mb-2">${t('writeResult')}</label>
          <div class="flex flex-wrap items-stretch gap-2">
            <input type="number" inputmode="numeric" id="user-result-input" value="${state.userResult}" oninput="handleResultInput(this.value)" onkeydown="handleResultKey(event)" placeholder="?" aria-label="${t('ariaResultInput')}" dir="ltr" class="focusable w-32 rounded-2xl border-2 border-slate-200 focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100 outline-none px-4 py-3 text-slate-800 text-2xl font-black text-center transition-all">
            <button id="check-btn" onClick="checkResult()" ${checkDisabled ? 'disabled' : ''} class="focusable inline-flex items-center justify-center gap-2 px-6 py-3 bg-indigo-600 text-white rounded-2xl font-bold hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition shadow-md text-sm">${getIcon('check','w-4 h-4')} ${t('check')}</button>
            ${!state.showMethods ? `<button onClick="toggleMethods()" class="focusable inline-flex items-center justify-center gap-2 px-5 py-3 bg-slate-100 text-slate-700 rounded-2xl font-bold hover:bg-slate-200 transition text-sm">💡 ${t('showMethods')}</button>` : ''}
          </div>
          ${feedbackHtml}
          ${methodsHtml}
        </div>
      `;
    }

    window.addEventListener('resize', () => { if (state.tab === 'kesif') window.adjustVerticalSliderWidth(); });

    applyDir();
    render();
  </script>

</body>
</html>
